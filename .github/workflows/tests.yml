name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301
      - run: dotnet test KaungAgent.sln --configuration Release
      - run: bash tests/scripts/bundled-plugins-test.sh
      - run: bash tests/scripts/content-engine-config-test.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fast test dependencies
        run: >-
          python -m pip install -c infra/content-engine/requirements.lock -r infra/content-engine/requirements-test.txt
          fastapi==0.159.1 httpx==0.28.1 openpyxl==3.1.5 xlrd==2.0.2 olefile==0.47
      - run: python -m unittest discover -s infra/content-engine -p test_processors.py -v
